name: Build & Release

# Triggers
on:
  push:
    tags:
      - 'v*'           # Runs automatically when a tag like v1.0.8 is pushed
  workflow_dispatch:   # Also allows manual run from the GitHub Actions UI

# Permissions
permissions:
  contents: write     # Required to create GitHub Releases and upload assets

jobs:
  # ================================================================
  #  Job 1: Build macOS DMG  (macos-latest runner)
  # ================================================================
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Convert .ico to .icns (macOS icon)
        run: |
          pip3 install Pillow --quiet --break-system-packages 2>/dev/null || pip3 install Pillow --quiet
          python3 scripts/ico_to_png.py

          ICONSET="ai-council.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 64 128 256 512; do
            sips -z $SIZE $SIZE ai-council-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png" &>/dev/null
            DOUBLE=$((SIZE * 2))
            sips -z $DOUBLE $DOUBLE ai-council-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" &>/dev/null
          done

          iconutil -c icns "$ICONSET" -o ai-council.icns
          rm -rf "$ICONSET" ai-council-src.png
          echo "ai-council.icns created"

      - name: Build (Vite)
        run: npm run build

      - name: Package DMG (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Skip code signing
        run: npx electron-builder --mac dmg --x64 --arm64

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg
          retention-days: 7

  # ================================================================
  #  Job 2: Build Windows NSIS installer  (windows-latest runner)
  # ================================================================
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download rcedit-x64.exe
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0\rcedit-x64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile $dest -UseBasicParsing
          Write-Host "rcedit-x64.exe ready"

      - name: Build (Vite)
        run: npm run build

      - name: Package Windows Installer (NSIS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Skip code signing
        run: npx electron-builder --win nsis

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 7

  # ================================================================
  #  Job 3: Create GitHub Release and attach all artifacts
  #  (runs only after both build jobs succeed, on tag push)
  # ================================================================
  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: List files
        run: find dist-all -type f

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Council ${{ github.ref_name }} - Council Chat Files + Telegram Files + DeepSeek"
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist-all/mac-dmg/*.dmg
            dist-all/windows-installer/*.exe
          body: |
            ### What's New in ${{ github.ref_name }}

            #### Council Chat File Attachment
            - **+Attach** button in Council Chat lets you attach files (PDF, DOCX, XLSX, TXT, MD, CSV, images) before sending any message
            - Files are physically uploaded to each AI browser interface via CDP; text fallback used when CDP upload is unavailable
            - Multiple files can be attached at once; each shows as a removable chip

            #### Telegram File Sharing
            - Send photos or documents directly from Telegram — downloaded and attached to the Council Chat session automatically
            - Photo albums (media groups) are bundled and processed as a single message
            - Supported formats: `pdf`, `doc`, `docx`, `xls`, `xlsx`, `txt`, `md`, `csv`, `json`, `html`, `png`, `jpg`, `jpeg`, `webp`, `gif`, `bmp`

            #### Bug Fix
            - Fixed duplicate file attachment for Claude: `DOM.setFileInputFiles` already fires a native change event — the extra manual dispatch was causing Claude's uploader to process each file twice

            #### Telegram Integration
            - Control AI Council from your smartphone via a Telegram bot
            - No server, no ngrok, no open ports — pure long-poll from the desktop app
            - Slash commands: `/new` · `/save [title]` · `/save_and_new [title]` · `/sessions` · `/load <id>` · `/workflow` · `/status` · `/help`
            - Bot token and chat ID stored in an **encrypted** `electron-store` file

            #### DeepSeek Support
            - DeepSeek (`chat.deepseek.com`) is the 6th AI panel
            - Reviewer role: **Concise Alternative Solver** — optimizes for simpler routes and sharper summaries

            ---

            ### Installation

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `AI-Council-${{ github.ref_name }}-arm64.dmg` |
            | macOS (Intel) | `AI-Council-${{ github.ref_name }}-x64.dmg` |
            | Windows | `AI-Council-Setup.exe` |

            > **macOS Gatekeeper:** System Settings -> Privacy & Security -> Open Anyway, or run `xattr -cr "/Applications/AI Council.app"` in Terminal.
            > **Windows SmartScreen:** Click "More info" -> "Run anyway".

  # ================================================================
  #  Job 4: Upload both macOS DMGs and Windows EXE to existing
  #  v1.0.8 release.  Runs only on workflow_dispatch (manual
  #  trigger — no tag needed).
  # ================================================================
  upload-installers-to-release:
    name: Upload Installers to v1.0.8 Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist-mac

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-win

      - name: List files
        run: find dist-mac dist-win -type f

      - name: Upload all installers to v1.0.8 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for DMG in dist-mac/*.dmg; do
            echo "Uploading $DMG..."
            gh release upload v1.0.8 "$DMG" \
              --repo MinkyuTheBuilder/ai-council \
              --clobber
          done
          for EXE in dist-win/*.exe; do
            echo "Uploading $EXE..."
            gh release upload v1.0.8 "$EXE" \
              --repo MinkyuTheBuilder/ai-council \
              --clobber
          done
          echo "All installers uploaded."
