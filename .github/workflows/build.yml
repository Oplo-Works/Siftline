name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload installers to'
        required: false
        default: 'v1.0.9'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Verify Node.js and npm contract
        run: |
          node --version
          npx --yes npm@10.9.8 --version

      - name: Install dependencies
        run: npx --yes npm@10.9.8 ci

      - name: Audit production dependencies
        run: npx --yes npm@10.9.8 audit --omit=dev

      - name: Convert .ico to .icns
        run: |
          pip3 install Pillow --quiet --break-system-packages 2>/dev/null || pip3 install Pillow --quiet
          python3 scripts/ico_to_png.py

          ICONSET="siftline.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 64 128 256 512; do
            sips -z $SIZE $SIZE siftline-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png" &>/dev/null
            DOUBLE=$((SIZE * 2))
            sips -z $DOUBLE $DOUBLE siftline-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" &>/dev/null
          done

          iconutil -c icns "$ICONSET" -o siftline.icns
          rm -rf "$ICONSET" siftline-src.png

      - name: Build app
        run: npm run build

      - name: Package DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg --x64 --arm64

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-dmg
          path: release/*.dmg
          retention-days: 7

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Verify Node.js and npm contract
        run: |
          node --version
          npx --yes npm@10.9.8 --version

      - name: Install dependencies
        run: npx --yes npm@10.9.8 ci

      - name: Audit production dependencies
        run: npx --yes npm@10.9.8 audit --omit=dev

      - name: Download rcedit-x64.exe
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0\rcedit-x64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile $dest -UseBasicParsing

      - name: Build app
        run: npm run build

      - name: Package Windows Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis

      - name: Upload EXE artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist-all

      - name: List files
        run: find dist-all -type f

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "AI Council ${{ github.ref_name }} - Hybrid Council Chat Layout"
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist-all/mac-dmg/*.dmg
            dist-all/windows-installer/*.exe
          body: |
            ### What's New in ${{ github.ref_name }}

            #### Hybrid Council Chat Layout
            - Council Chat is now the primary workspace on launch.
            - The main view uses a left Focus AI pane, a center Compare grid for the other active AIs, and the docked Council Chat panel on the right.
            - Compare panes include a Focus action so any active AI can be promoted into the large left pane.
            - Workflow mode remains in the app for future use, but the top-level Workflow toggle and handoff buttons are hidden from the primary Council Chat UI.

            #### Installer Notes
            - Windows installer is built with NSIS.
            - macOS DMGs are built on GitHub's macOS runner for both Intel and Apple Silicon.

            ### Installation

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `Siftline-*-arm64.dmg` |
            | macOS (Intel) | `Siftline-*-x64.dmg` |
            | Windows | `Siftline-Setup-*.exe` |

            > macOS Gatekeeper: System Settings -> Privacy & Security -> Open Anyway, or run `xattr -cr "/Applications/Siftline.app"` in Terminal.
            > Windows SmartScreen: Click "More info" -> "Run anyway".

  upload-installers-to-release:
    name: Upload Installers to Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac-dmg
          path: dist-mac

      - name: Download windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: dist-win

      - name: List files
        run: find dist-mac dist-win -type f

      - name: Create release if needed and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "AI Council $RELEASE_TAG - Hybrid Council Chat Layout" \
              --notes "Installers for AI Council $RELEASE_TAG."

          for DMG in dist-mac/*.dmg; do
            echo "Uploading $DMG..."
            gh release upload "$RELEASE_TAG" "$DMG" \
              --repo "${{ github.repository }}" \
              --clobber
          done

          for EXE in dist-win/*.exe; do
            echo "Uploading $EXE..."
            gh release upload "$RELEASE_TAG" "$EXE" \
              --repo "${{ github.repository }}" \
              --clobber
          done
