name: Build & Release

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'           # Runs automatically when a tag like v1.0.7 is pushed
  workflow_dispatch:   # Also allows manual run from the GitHub Actions UI

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: write     # Required to create GitHub Releases and upload assets

jobs:
  # ════════════════════════════════════════════════════════════════
  #  Job 1: Build macOS DMG  (macos-latest runner)
  # ════════════════════════════════════════════════════════════════
  build-mac:
    name: 🍎 Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Convert .ico to .icns (macOS icon)
        run: |
          pip3 install Pillow --quiet --break-system-packages 2>/dev/null || pip3 install Pillow --quiet
          python3 scripts/ico_to_png.py

          ICONSET="ai-council.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 64 128 256 512; do
            sips -z $SIZE $SIZE ai-council-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png" &>/dev/null
            DOUBLE=$((SIZE * 2))
            sips -z $DOUBLE $DOUBLE ai-council-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" &>/dev/null
          done

          iconutil -c icns "$ICONSET" -o ai-council.icns
          rm -rf "$ICONSET" ai-council-src.png
          echo "ai-council.icns created"

      - name: Build (Vite)
        run: npm run build

      - name: Package DMG (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Skip code signing
        run: npx electron-builder --mac dmg --x64 --arm64

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  #  Job 2: Build Windows NSIS installer  (windows-latest runner)
  # ════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download rcedit-x64.exe
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0\rcedit-x64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile $dest -UseBasicParsing
          Write-Host "✔ rcedit-x64.exe ready"

      - name: Build (Vite)
        run: npm run build

      - name: Package Windows Installer (NSIS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Skip code signing
        run: npx electron-builder --win nsis

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  #  Job 3: Create GitHub Release and attach all artifacts
  #  (runs only after both build jobs succeed)
  # ════════════════════════════════════════════════════════════════
  release:
    name: 🚀 Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: List files
        run: find dist-all -type f

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Council ${{ github.ref_name }} — Council Chat Mode"
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist-all/mac-dmg/*.dmg
            dist-all/windows-installer/*.exe
          body: |
            ### ✨ What's New in ${{ github.ref_name }}

            #### 💬 Council Chat Mode
            - Brand-new group-chat panel alongside the existing Workflow mode
            - Bubble-style UI with left/right alignment (inspired by WhatsApp/KakaoTalk)
            - `@mention` system: use `@Gemini`, `@Claude`, `@all` to target specific AIs
            - 2-sentence preview with "▼ Read More" toggle for long responses
            - Real-time streaming response display with typing indicator

            #### 🔀 Dual Interaction Mode
            - Seamless toggle between **Workflow** (structured 3-step review) and **Council Chat** (free-form discussion)
            - Participants and primary AI selection carry across both modes
            - One-click bridge from Workflow results into a Council Chat discussion

            #### 💾 Saved Sessions (Snapshots)
            - Save / load any Council Chat session with full message and UI state
            - Favorites, labels, notes, archive, bulk-delete, export/import as JSON, duplicate
            - Auto-saves every 3 seconds after any change so you never lose a conversation

            #### 🎯 AI Moderator
            - Real-time consensus analysis of the ongoing conversation
            - Suggests the next speaker and a ready-to-send follow-up prompt
            - **Apply** (paste to input) or **Send Now** for instant dispatch

            #### 📌 Candidate Pinning & Comparison
            - Pin any AI reply as a candidate answer
            - Side-by-side comparison panel for all pinned candidates
            - Generate a **merged draft** from two or more pinned replies before handing off to Workflow

            #### 🔗 Workflow Handoff
            - Move the full Council Chat transcript to Workflow as a structured seed prompt
            - Move a single pinned reply to Workflow with one click
            - Use a selected or merged candidate as the Workflow starting draft

            #### 🌐 Response Language Detection
            - Automatic detection of the user's script (Korean, Japanese, Chinese, Arabic, Cyrillic, and more)
            - A language directive is injected into every prompt so AIs always reply in your language
            - Applies to Workflow prompts, reviewer feedback, revisions, and Council Chat messages

            ---

            ### 📥 Installation

            | Platform | File |
            |----------|------|
            | 🍎 macOS (Apple Silicon) | `AI-Council-${{ github.ref_name }}-arm64.dmg` |
            | 🍎 macOS (Intel) | `AI-Council-${{ github.ref_name }}-x64.dmg` |
            | 🪟 Windows | `AI-Council-Setup.exe` |

            > **macOS Gatekeeper:** If macOS blocks the app, go to System Settings → Privacy & Security → Open Anyway, or run `xattr -cr "/Applications/AI Council.app"` in Terminal.
            > **Windows SmartScreen:** Click "More info" → "Run anyway".
