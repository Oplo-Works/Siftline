name: Build & Release

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'          # Runs automatically when a tag like v1.0.6 is pushed
  workflow_dispatch:   # Also allows manual run from the GitHub Actions UI

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: write     # Required to create GitHub Releases and upload assets

jobs:
  # ════════════════════════════════════════════════════════════════
  #  Job 1: Build macOS DMG  (macos-latest runner)
  # ════════════════════════════════════════════════════════════════
  build-mac:
    name: 🍎 Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Convert .ico to .icns (macOS icon)
        run: |
          pip3 install Pillow --quiet --break-system-packages 2>/dev/null || pip3 install Pillow --quiet
          python3 scripts/ico_to_png.py

          ICONSET="ai-council.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 64 128 256 512; do
            sips -z $SIZE $SIZE ai-council-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png" &>/dev/null
            DOUBLE=$((SIZE * 2))
            sips -z $DOUBLE $DOUBLE ai-council-src.png --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" &>/dev/null
          done

          iconutil -c icns "$ICONSET" -o ai-council.icns
          rm -rf "$ICONSET" ai-council-src.png
          echo "ai-council.icns created"

      - name: Build (Vite)
        run: npm run build

      - name: Package DMG (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Skip code signing
        run: npx electron-builder --mac dmg --x64 --arm64

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  #  Job 2: Build Windows NSIS installer  (windows-latest runner)
  # ════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download rcedit-x64.exe
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0\rcedit-x64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile $dest -UseBasicParsing
          Write-Host "✔ rcedit-x64.exe ready"

      - name: Build (Vite)
        run: npm run build

      - name: Package Windows Installer (NSIS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Skip code signing
        run: npx electron-builder --win nsis

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  #  Job 3: Create GitHub Release and attach all artifacts
  #  (runs only after both build jobs succeed)
  # ════════════════════════════════════════════════════════════════
  release:
    name: 🚀 Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')   # 태그 push 시에만 Release 생성

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: List files
        run: find dist-all -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Council ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            dist-all/mac-dmg/*.dmg
            dist-all/windows-installer/*.exe
          body: |
            ## AI Council ${{ github.ref_name }}

            ### ✨ What's New
            - **API Keys Tab** — Store API keys for Gemini, Claude, ChatGPT, Perplexity, Grok, and Groq directly in the Accounts panel. Drag-and-drop to set provider priority for query analysis.
            - **AI Recommendation Engine** — As you type a query, the app recommends the best Primary AI with a reason. Falls back to rule-based logic when no API key is set.
            - **Mid-Workflow Primary AI Reassignment** — Switch the Primary AI at either pause point (▶▶ Next or ✓ Continue) and the workflow continues with the new selection.

            ### 📥 Installation
            | Platform | File | Instructions |
            |----------|------|--------------|
            | 🍎 macOS (Intel) | `AI-Council-${{ github.ref_name }}-x64.dmg` | Open DMG, drag AI Council to Applications |
            | 🍎 macOS (Apple Silicon M1/M2/M3/M4) | `AI-Council-${{ github.ref_name }}-arm64.dmg` | Same as above |
            | 🪟 Windows 10 / 11 | `AI-Council-Setup.exe` | Double-click to run the setup wizard |

            > **macOS Gatekeeper:** If macOS blocks the app, go to System Settings → Privacy & Security → Open Anyway, or run `xattr -cr "/Applications/AI Council.app"` in Terminal.
            > **Windows SmartScreen:** Click "More info" → "Run anyway".
